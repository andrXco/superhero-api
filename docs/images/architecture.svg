<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1040" viewBox="0 0 1600 1040" role="img" aria-labelledby="title desc">
  <title id="title">Mapa de arquitectura de Superhero API</title>
  <desc id="desc">Architecture diagram of the Android client, presentation and data layers, Hilt injection, Akabab REST API, and image loading through Coil.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#0B1020"/><stop offset="1" stop-color="#151D35"/></linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#A78BFA"/><stop offset="1" stop-color="#6366F1"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="12" stdDeviation="18" flood-color="#020617" flood-opacity=".4"/></filter>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="9" refY="6" orient="auto"><path d="M1 1 10 6 1 11" fill="none" stroke="#A5B4FC" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></marker>
    <marker id="arrowGreen" markerWidth="12" markerHeight="12" refX="9" refY="6" orient="auto"><path d="M1 1 10 6 1 11" fill="none" stroke="#6EE7B7" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></marker>
    <style>
      text{font-family:Inter,Segoe UI,Arial,sans-serif;fill:#F8FAFC}.muted{fill:#AAB6D3}.tiny{font-size:14px;letter-spacing:.04em}.small{font-size:16px}.body{font-size:18px}.heading{font-size:22px;font-weight:700}.card{fill:#151E34;stroke:#33415F;stroke-width:1.5}.inside{fill:#1B2742;stroke:#344563;stroke-width:1.2}.pill{fill:#232F4B}.line{fill:none;stroke:#A5B4FC;stroke-width:2.6;marker-end:url(#arrow)}.response{fill:none;stroke:#6EE7B7;stroke-width:2.4;stroke-dasharray:8 7;marker-end:url(#arrowGreen)}
    </style>
  </defs>
  <rect width="1600" height="1040" rx="34" fill="url(#bg)"/>
  <circle cx="1370" cy="95" r="190" fill="#4F46E5" opacity=".08"/><circle cx="1435" cy="105" r="110" fill="#A78BFA" opacity=".06"/>
  <text x="80" y="76" class="tiny" fill="#A78BFA">ANDROID · REST CLIENT</text>
  <text x="80" y="128" font-size="42" font-weight="750">Application architecture</text>
  <text x="80" y="164" class="body muted">Layers, dependencies, and the actual flow of character requests</text>
  <rect x="62" y="205" width="1138" height="700" rx="28" fill="#10182B" stroke="#34415C" stroke-width="2"/>
  <rect x="84" y="226" width="285" height="34" rx="17" fill="#252047"/><text x="104" y="249" class="tiny" fill="#C4B5FD">ANDROID APP · KOTLIN</text>

  <!-- Presentation -->
  <rect x="95" y="300" width="305" height="470" rx="22" class="card" filter="url(#shadow)"/>
  <text x="123" y="342" class="tiny" fill="#A78BFA">01 · PRESENTATION</text>
  <text x="123" y="380" class="heading">Jetpack Compose</text>
  <rect x="120" y="405" width="255" height="76" rx="14" class="inside"/>
  <text x="140" y="435" class="body" font-weight="650">HomeScreen</text><text x="140" y="461" class="small muted">Catalog · LazyColumn</text>
  <rect x="120" y="497" width="255" height="76" rx="14" class="inside"/>
  <text x="140" y="527" class="body" font-weight="650">HeroDetailScreen</text><text x="140" y="553" class="small muted">Profile · data · power stats</text>
  <rect x="120" y="589" width="255" height="65" rx="14" class="pill"/>
  <text x="140" y="617" class="small">Navigation Compose</text><text x="140" y="641" class="small muted">home → hero_detail/{id}</text>
  <rect x="120" y="670" width="255" height="69" rx="14" fill="#202943"/>
  <text x="140" y="699" class="small" fill="#C4B5FD">UI state</text><text x="140" y="724" class="small muted">loading · error · content</text>

  <!-- Viewmodels / Repo -->
  <rect x="440" y="300" width="300" height="206" rx="22" class="card" filter="url(#shadow)"/>
  <text x="468" y="342" class="tiny" fill="#A78BFA">02 · STATE</text>
  <text x="468" y="379" class="heading">ViewModels</text>
  <text x="468" y="413" class="small muted">HomeViewModel</text><text x="468" y="439" class="small muted">HeroDetailViewModel</text>
  <rect x="468" y="455" width="240" height="31" rx="15" class="pill"/><text x="484" y="477" class="tiny">viewModelScope · StateFlow</text>
  <rect x="440" y="556" width="300" height="214" rx="22" class="card" filter="url(#shadow)"/>
  <text x="468" y="598" class="tiny" fill="#A78BFA">03 · DOMAIN / DATA</text>
  <text x="468" y="635" class="heading">SuperheroRepository</text>
  <text x="468" y="670" class="small muted">Coordinates catalog and detail</text>
  <text x="468" y="698" class="small muted">DTO → Superhero · Result&lt;T&gt;</text>
  <text x="468" y="739" class="tiny" fill="#6EE7B7">Errors returned to the ViewModel</text>

  <!-- Network -->
  <rect x="780" y="300" width="370" height="470" rx="22" class="card" filter="url(#shadow)"/>
  <text x="808" y="342" class="tiny" fill="#A78BFA">04 · REMOTE ACCESS</text>
  <rect x="808" y="365" width="314" height="86" rx="15" class="inside"/>
  <text x="830" y="399" class="heading">RemoteDataSource</text><text x="830" y="428" class="small muted">interface + Retrofit implementation</text>
  <rect x="808" y="468" width="314" height="78" rx="15" class="inside"/>
  <text x="830" y="500" class="heading">SuperheroService</text><text x="830" y="527" class="small muted">REST endpoint interface</text>
  <rect x="808" y="564" width="314" height="78" rx="15" class="inside"/>
  <text x="830" y="596" class="heading">Retrofit + Gson</text><text x="830" y="623" class="small muted">HTTP · JSON → DTOs</text>
  <rect x="808" y="660" width="314" height="75" rx="15" fill="#202943"/>
  <text x="830" y="691" class="small" fill="#C4B5FD">SuperheroDto</text><text x="830" y="718" class="small muted">bio · appearance · stats · images</text>

  <!-- DI side rail -->
  <rect x="88" y="800" width="1080" height="76" rx="18" fill="#191D3B" stroke="#514596" stroke-width="1.5"/>
  <circle cx="127" cy="838" r="19" fill="url(#accent)"/><text x="121" y="845" font-size="18" font-weight="800">H</text>
  <text x="161" y="834" class="heading">Hilt · dependency injection</text><text x="161" y="858" class="small muted">NetworkModule: Gson / Retrofit / Service  ·  DatasourceModule: interface → implementation  ·  injected ViewModels</text>

  <!-- External API -->
  <rect x="1240" y="302" width="300" height="245" rx="24" fill="#122B2C" stroke="#2C7A6B" stroke-width="1.7" filter="url(#shadow)"/>
  <circle cx="1280" cy="346" r="18" fill="#10B981" opacity=".18"/><path d="M1271 346h18m-9-9v18" stroke="#6EE7B7" stroke-width="2" stroke-linecap="round"/>
  <text x="1310" y="353" class="tiny" fill="#6EE7B7">SERVICIO EXTERNO</text>
  <text x="1270" y="396" class="heading">Akabab Superhero API</text>
  <text x="1270" y="429" class="small muted">akabab.github.io/</text><text x="1270" y="453" class="small muted">superhero-api/api</text>
  <rect x="1270" y="476" width="240" height="29" rx="14" fill="#16443D"/><text x="1284" y="496" class="tiny" fill="#A7F3D0">HTTPS · JSON</text>
  <text x="1270" y="528" class="tiny muted">Public API · no custom backend</text>
  <path d="M1125 507 C1184 507 1185 423 1239 423" class="line"/>
  <text x="1137" y="474" class="tiny" fill="#C7D2FE">GET</text>
  <text x="1147" y="449" class="tiny muted">/all.json</text>
  <path d="M1238 453 C1185 453 1180 545 1125 545" class="response"/>
  <text x="1132" y="569" class="tiny" fill="#6EE7B7">JSON response</text>
  <path d="M1125 610 C1180 610 1180 489 1238 489" class="line"/>
  <text x="1132" y="636" class="tiny" fill="#C7D2FE">GET /id/{id}.json</text>

  <!-- Image delivery -->
  <rect x="1240" y="650" width="300" height="170" rx="24" fill="#1D1A35" stroke="#6556A8" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="1270" y="690" class="tiny" fill="#C4B5FD">REMOTE IMAGES</text>
  <text x="1270" y="729" class="heading">URLs de la API</text>
  <text x="1270" y="759" class="small muted">images.lg → images.md</text>
  <text x="1270" y="790" class="small" fill="#C4B5FD">Coil 3 fetches and displays</text>
  <path d="M1122 701 C1175 701 1188 739 1238 739" class="response"/>
  <text x="1155" y="724" class="tiny" fill="#6EE7B7">model imageUrl</text>

  <rect x="80" y="941" width="18" height="4" rx="2" fill="#A5B4FC"/><text x="110" y="949" class="small muted">request</text>
  <rect x="220" y="941" width="18" height="4" rx="2" fill="#6EE7B7"/><text x="250" y="949" class="small muted">response / image data</text>
  <text x="80" y="995" class="small muted">The JSON response provides the URLs; Coil fetches them to load portraits · No local database · INTERNET permission · min SDK 24</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="760" viewBox="0 0 1500 760" role="img" aria-labelledby="title desc">
  <title id="title">Superhero API screen mockup</title>
  <desc id="desc">Conceptual representation of the superhero catalog screen and a character detail screen on Android phones.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#0C1223"/><stop offset="1" stop-color="#181C36"/></linearGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#7256DC"/><stop offset="1" stop-color="#393E91"/></linearGradient>
    <linearGradient id="portrait" x1="0" y1="0" x2=".85" y2="1"><stop stop-color="#38BDF8"/><stop offset="1" stop-color="#4338CA"/></linearGradient>
    <filter id="shadow" x="-30%" y="-20%" width="160%" height="160%"><feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#030712" flood-opacity=".5"/></filter>
    <style>
      text{font-family:Inter,Segoe UI,Arial,sans-serif;fill:#F8FAFC}.muted{fill:#64748B}.lightmuted{fill:#B8C0D9}.label{font-size:14px;letter-spacing:.12em;font-weight:700}.heading{font-size:23px;font-weight:750}.small{font-size:14px}.body{font-size:17px}.phone{fill:#F8FAFC}.ink{fill:#172033}.screenmuted{fill:#68748B}
    </style>
  </defs>
  <rect width="1500" height="760" rx="32" fill="url(#bg)"/>
  <circle cx="1330" cy="145" r="190" fill="#7C3AED" opacity=".10"/><circle cx="190" cy="700" r="170" fill="#4F46E5" opacity=".10"/>
  <text x="76" y="70" class="label" fill="#A78BFA">SUPERHERO API · ANDROID</text>
  <text x="76" y="122" font-size="38" font-weight="750">Explore the superhero universe</text>
  <text x="76" y="156" class="body lightmuted">Browse characters and profiles with biographies, images, and stats.</text>
  <text x="396" y="210" text-anchor="middle" class="label" fill="#C4B5FD">01 · CATALOG</text>
  <text x="1102" y="210" text-anchor="middle" class="label" fill="#C4B5FD">02 · CHARACTER PROFILE</text>

  <!-- Phone 1 -->
  <g filter="url(#shadow)"><rect x="250" y="232" width="292" height="468" rx="38" fill="#090D16" stroke="#475569" stroke-width="2"/><rect x="262" y="245" width="268" height="442" rx="29" class="phone"/></g>
  <rect x="346" y="253" width="100" height="18" rx="9" fill="#090D16"/>
  <text x="280" y="293" font-size="10" class="ink" font-weight="700">9:41</text><circle cx="493" cy="287" r="4" fill="#172033"/><path d="M503 290h13" stroke="#172033" stroke-width="2" stroke-linecap="round"/>
  <text x="282" y="333" font-size="22" class="ink" font-weight="750">Superheroes</text><text x="282" y="356" class="small screenmuted">Discover characters</text>

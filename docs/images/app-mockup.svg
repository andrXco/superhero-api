  <rect x="288" y="383" width="54" height="60" rx="10" fill="url(#portrait)"/>
  <circle cx="315" cy="402" r="11" fill="#F5C7A5"/><path d="M304 401q11-17 23 0v-7q-12-13-23 0z" fill="#1E293B"/><path d="M298 439q2-24 17-24 16 0 18 24" fill="#E63946"/><path d="m309 419 6 5 7-5" fill="#F8FAFC"/>
  <text x="354" y="405" font-size="15" class="ink" font-weight="700">Spider-Man</text><text x="354" y="425" class="small screenmuted">Peter Parker</text><text x="354" y="443" font-size="11" class="screenmuted">Marvel Comics</text>
  <rect x="278" y="462" width="236" height="78" rx="15" fill="#EEF1F8"/>
  <rect x="288" y="471" width="54" height="60" rx="10" fill="#E2A63A"/>
  <circle cx="315" cy="490" r="11" fill="#E7B890"/><path d="M304 489q10-17 22 0v-8q-11-12-22 0z" fill="#4B291E"/><path d="M298 527q2-23 17-23 16 0 18 23" fill="#29478E"/><path d="m305 510 10 7 10-7" fill="#DAB938"/>
  <text x="354" y="493" font-size="15" class="ink" font-weight="700">Wonder Woman</text><text x="354" y="513" class="small screenmuted">Diana Prince</text><text x="354" y="531" font-size="11" class="screenmuted">DC Comics</text>
  <rect x="278" y="550" width="236" height="78" rx="15" fill="#EEF1F8"/>
  <rect x="288" y="559" width="54" height="60" rx="10" fill="#344A69"/>
  <circle cx="315" cy="578" r="11" fill="#E6BA99"/><path d="M304 579q11-20 22-1v-12q-13-12-22 0z" fill="#111827"/><path d="M298 615q2-23 17-23 16 0 18 23" fill="#171B26"/><path d="m306 598 9 6 9-6" fill="#FACC15"/>
  <text x="354" y="581" font-size="15" class="ink" font-weight="700">Batman</text><text x="354" y="601" class="small screenmuted">Bruce Wayne</text><text x="354" y="619" font-size="11" class="screenmuted">DC Comics</text>
  <rect x="352" y="671" width="88" height="5" rx="2.5" fill="#172033"/>

  <!-- Connector -->
  <path d="M577 469h98" stroke="#A78BFA" stroke-width="2.5" stroke-dasharray="5 7"/><circle cx="626" cy="469" r="23" fill="#242145" stroke="#7561D2"/><path d="M618 469h15m-6-7 7 7-7 7" fill="none" stroke="#DDD6FE" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Phone 2 -->
  <g filter="url(#shadow)"><rect x="850" y="232" width="292" height="468" rx="38" fill="#090D16" stroke="#475569" stroke-width="2"/><rect x="862" y="245" width="268" height="442" rx="29" class="phone"/></g>
  <rect x="946" y="253" width="100" height="18" rx="9" fill="#090D16"/>
  <text x="880" y="293" font-size="10" class="ink" font-weight="700">9:41</text><circle cx="1093" cy="287" r="4" fill="#172033"/><path d="M1103 290h13" stroke="#172033" stroke-width="2" stroke-linecap="round"/>
  <text x="882" y="329" font-size="14" fill="#5141A5" font-weight="650">‹  Back</text>
  <rect x="882" y="345" width="228" height="148" rx="16" fill="url(#panel)"/>
  <circle cx="996" cy="400" r="39" fill="#FFFFFF" opacity=".1"/><circle cx="996" cy="390" r="24" fill="#EEC29F"/><path d="M971 392q24-38 50 0v-15q-25-25-50 0z" fill="#A92A38"/><path d="M955 476q5-65 41-65 37 0 42 65" fill="#D8384A"/><path d="m976 419 20 13 20-13" fill="#F8FAFC"/><path d="M882 345h16v16h-16z" fill="#FFFFFF" opacity=".12"/>

  <rect x="882" y="566" width="108" height="26" rx="13" fill="#EEEAFB"/><text x="896" y="584" font-size="11" fill="#5141A5" font-weight="700">Marvel Comics</text>
  <text x="882" y="619" class="small ink" font-weight="700">Power stats</text>
  <text x="882" y="641" font-size="10" class="screenmuted">INTELIGENCIA</text><rect x="972" y="634" width="112" height="8" rx="4" fill="#E8EAF1"/><rect x="972" y="634" width="82" height="8" rx="4" fill="#6C56C9"/>
  <text x="882" y="662" font-size="10" class="screenmuted">FUERZA</text><rect x="972" y="655" width="112" height="8" rx="4" fill="#E8EAF1"/><rect x="972" y="655" width="94" height="8" rx="4" fill="#6C56C9"/>
  <rect x="952" y="671" width="88" height="5" rx="2.5" fill="#172033"/>

  <rect x="1208" y="305" width="222" height="130" rx="18" fill="#171E35" stroke="#34415C"/>
  <text x="1230" y="340" class="label" fill="#A78BFA">CATALOG</text><text x="1230" y="371" class="small lightmuted">Character list</text><text x="1230" y="396" class="small lightmuted">Image, name, and publisher</text>
  <rect x="1208" y="455" width="222" height="154" rx="18" fill="#171E35" stroke="#34415C"/>
  <text x="1230" y="490" class="label" fill="#6EE7B7">DETAIL</text><text x="1230" y="521" class="small lightmuted">Biography and appearance</text><text x="1230" y="546" class="small lightmuted">Power stats</text><text x="1230" y="581" class="small" fill="#C4B5FD">GET /id/{id}.json</text>
  <text x="1208" y="658" class="small lightmuted">Visual concept based on</text><text x="1208" y="681" class="small lightmuted">the screens in the code.</text>
</svg>
